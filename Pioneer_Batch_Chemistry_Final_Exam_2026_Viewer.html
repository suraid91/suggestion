<style>
:root{--bg:#09090b;--panel:#111114;--line:#27272a;--text:#fafafa;--muted:#a1a1aa}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
body{display:flex;flex-direction:column}
header{height:58px;flex:0 0 58px;display:flex;align-items:center;gap:12px;padding:0 14px;background:rgba(17,17,20,.96);border-bottom:1px solid var(--line);z-index:10}
.brand{min-width:0;display:flex;flex-direction:column}.brand b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand span{font-size:11px;color:var(--muted)}
.spacer{flex:1}.btn{height:36px;min-width:36px;padding:0 11px;border:1px solid var(--line);border-radius:10px;background:#18181b;color:var(--text);cursor:pointer;font-size:14px}
.btn:hover{background:#222225}.btn:active{transform:scale(.98)}.btn:disabled{opacity:.4;cursor:not-allowed}
#pageInfo{font-size:13px;color:var(--muted);white-space:nowrap}
main{position:relative;flex:1;overflow:auto;background:#050506}
#viewer{min-height:100%;padding:24px 12px 40px;display:flex;flex-direction:column;align-items:center;gap:18px}
.pageWrap{position:relative;background:white;box-shadow:0 8px 35px rgba(0,0,0,.45);line-height:0}
.pageWrap canvas{display:block;max-width:none}
#status{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px;padding:20px;text-align:center}
#zoomLabel{min-width:54px;text-align:center;font-size:12px;color:var(--muted)}
@media(max-width:600px){
 header{height:54px;flex-basis:54px;padding:0 8px;gap:6px}
 .brand b{font-size:12px}.brand span{font-size:10px}
 .btn{height:34px;min-width:34px;padding:0 8px;border-radius:9px}
 #pageInfo{font-size:11px}.hideMobile{display:none}
 #viewer{padding:10px 4px 24px;gap:10px}
}
</style>

const pdfjsVersion = "4.10.38";
const pdfjsURL = `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${pdfjsVersion}/pdf.min.mjs`;
const workerURL = `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${pdfjsVersion}/pdf.worker.min.mjs`;

let pdf = null, scale = 1, current = 1, rendering = false;

const viewer = document.getElementById("viewer");
const scroller = document.getElementById("scroller");
const status = document.getElementById("status");
const pageInfo = document.getElementById("pageInfo");
const zoomLabel = document.getElementById("zoomLabel");
const prev = document.getElementById("prev");
const next = document.getElementById("next");

function updateUI(){
  pageInfo.textContent = `${current} / ${pdf ? pdf.numPages : 3}`;
  zoomLabel.textContent = `${Math.round(scale*100)}%`;
  prev.disabled = current <= 1;
  next.disabled = !pdf || current >= pdf.numPages;
}
function clearViewer(){ viewer.innerHTML=""; }

async function renderPage(num, targetScale=scale){
  if(!pdf || rendering) return;
  rendering=true;
  try{
    const page=await pdf.getPage(num);
    const viewport=page.getViewport({scale:targetScale});
    const wrap=document.createElement("div");
    wrap.className="pageWrap";
    wrap.dataset.page=num;
    const canvas=document.createElement("canvas");
    canvas.width=Math.ceil(viewport.width);
    canvas.height=Math.ceil(viewport.height);
    canvas.style.width=viewport.width+"px";
    canvas.style.height=viewport.height+"px";
    wrap.appendChild(canvas);
    viewer.appendChild(wrap);
    await page.render({canvasContext:canvas.getContext("2d"),viewport}).promise;
  }catch(e){ console.error(e); }
  finally{ rendering=false; }
}
async function renderAll(){
  if(!pdf)return;
  clearViewer();
  for(let i=1;i<=pdf.numPages;i++) await renderPage(i,scale);
  updateUI();
}
function fitWidth(){
  if(!pdf)return;
  // Render page 1 at a width that fits the available viewer width.
  pdf.getPage(1).then(p=>{
    const base=p.getViewport({scale:1});
    const available=Math.max(280, scroller.clientWidth-28);
    scale=Math.max(.5,Math.min(2.5,available/base.width));
    renderAll();
  });
}
async function init(){
  try{
    const pdfjsLib=await import(pdfjsURL);
    pdfjsLib.GlobalWorkerOptions.workerSrc=workerURL;
    const raw=atob(PDF_DATA.split(",")[1]);
    const bytes=new Uint8Array(raw.length);
    for(let i=0;i<raw.length;i++) bytes[i]=raw.charCodeAt(i);
    pdf=await pdfjsLib.getDocument({data:bytes}).promise;
    status?.remove();
    updateUI();
    fitWidth();
  }catch(e){
    console.error(e);
    status.textContent="Could not load the PDF. If you opened this file completely offline, connect to the internet once so the PDF viewer engine can load.";
  }
}
prev.onclick=()=>{if(current>1){current--; document.querySelector(`[data-page="${current}"]`)?.scrollIntoView({behavior:"smooth",block:"start"});updateUI();}};
next.onclick=()=>{if(pdf&&current<pdf.numPages){current++; document.querySelector(`[data-page="${current}"]`)?.scrollIntoView({behavior:"smooth",block:"start"});updateUI();}};
document.getElementById("minus").onclick=()=>{scale=Math.max(.5,scale-.1);renderAll()};
document.getElementById("plus").onclick=()=>{scale=Math.min(2.5,scale+.1);renderAll()};
document.getElementById("fit").onclick=fitWidth;
document.getElementById("download").onclick=()=>{
  const a=document.createElement("a");
  a.href=PDF_DATA;
  a.download="Pioneer_Batch_Chemistry_Final_Exam_2026.pdf";
  document.body.appendChild(a);
  a.click();
  a.remove();
};
document.getElementById("full").onclick=()=>document.documentElement.requestFullscreen?.();
scroller.addEventListener("scroll",()=>{
  if(!pdf)return;
  const pages=[...document.querySelectorAll(".pageWrap")];
  let best=1, bestD=Infinity;
  pages.forEach(p=>{
    const d=Math.abs(p.getBoundingClientRect().top-scroller.getBoundingClientRect().top-10);
    if(d<bestD){bestD=d;best=+p.dataset.page;}
  });
  current=best; updateUI();
});
window.addEventListener("resize",()=>{ if(pdf) fitWidth(); });
init();
</script>
